[package]
name = "gb-mcp"
version = "1.10.1"
edition = "2021"
description = "Model Context Protocol server (stdio) for reverse-engineering and debugging Game Boy ROMs on gb-core"
license = "MIT"
repository = "https://github.com/phmatray/cartouche"
publish = false

[dependencies]
gb-core = { path = "../gb-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
sha1_smol = "1"
regex-lite = "0.1"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 2

# Standalone: not part of any parent workspace.
[workspace]
