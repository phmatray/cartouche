[package]
name = "gb-core"
version = "1.2.1"
edition = "2021"
description = "Game Boy / Game Boy Color emulation core for Cartouche, compiled to WebAssembly"
license = "MIT"
repository = "https://github.com/phmatray/cartouche"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
thiserror = "2"
log = "0.4"

[dev-dependencies]
wasm-bindgen-test = "0.3"
png = "0.18"
flate2 = "1"

[profile.release]
opt-level = "s"
lto = true
